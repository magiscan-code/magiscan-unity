# EditMode tests on a matrix of Unity versions + package sanity checks.
#
# Repository secrets used by the "tests" job (see https://game.ci/docs/github/activation):
#   UNITY_LICENSE  — contents of a Unity Personal .ulf license file
#   UNITY_EMAIL    — Unity account e-mail
#   UNITY_PASSWORD — Unity account password
#
# Until UNITY_LICENSE is configured, the Unity steps are skipped (the job passes with a notice);
# the "checks" job always runs and needs no secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Package sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PluginVersion matches package.json
        run: |
          PKG=$(jq -r .version package.json)
          CODE=$(grep -oP 'PluginVersion = "\K[^"]+' Runtime/MagiscanSettings.cs)
          echo "package.json: $PKG / MagiscanSettings.PluginVersion: $CODE"
          test "$PKG" = "$CODE"

      - name: Declared samples exist
        run: |
          for p in $(jq -r '.samples[]?.path' package.json); do
            echo "checking $p"
            test -d "$p"
          done

  tests:
    name: EditMode (${{ matrix.unityVersion }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2021.3.45f1
          - 2022.3.62f1
          - 6000.0.58f1
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Unity license not configured
        if: env.UNITY_LICENSE == ''
        run: echo "::notice::UNITY_LICENSE secret is not set — Unity EditMode tests skipped."

      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''

      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: Library
          key: Library-${{ matrix.unityVersion }}

      - uses: game-ci/unity-test-runner@v4
        if: env.UNITY_LICENSE != ''
        with:
          unityVersion: ${{ matrix.unityVersion }}
          testMode: EditMode
          packageMode: true
